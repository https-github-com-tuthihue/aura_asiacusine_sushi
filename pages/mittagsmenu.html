    <script>
        function addToCart(product) {

    let cart =
        JSON.parse(localStorage.getItem('cart')) || [];

    const existing =
        cart.find(item => item.id === product.id && item.name === product.name);

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    localStorage.setItem('cart', JSON.stringify(cart));

    updateCartCount();
    updateHeaderCartCount();

    showAddToCartNotification();
}

/* =========================
   NOTIFICATION
========================= */

function showAddToCartNotification() {

    const notification =
        document.createElement('div');

    notification.className =
        'cart-notification';

    notification.innerText =
        '✓ Zum Warenkorb hinzugefügt';

    notification.style.cssText = `
        position: fixed;
        bottom: 80px;
        right: 20px;
        background: #4CAF50;
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
        animation: fadeOut 2s ease forwards;
    `;

    document.body.appendChild(notification);

    setTimeout(() => notification.remove(), 2000);
}

/* =========================
   CART COUNT
========================= */

function updateCartCount() {

    const cart =
        JSON.parse(localStorage.getItem('cart')) || [];

    const total =
        cart.reduce((sum, item) => sum + item.quantity, 0);

    const el =
        document.getElementById('cartCount');

    if (el) el.innerText = total;
}

function updateHeaderCartCount() {

    const cart =
        JSON.parse(localStorage.getItem('cart')) || [];

    const total =
        cart.reduce((sum, item) => sum + item.quantity, 0);

    const el =
        document.getElementById('cart-count');

    if (el) el.innerText = total;
}

/* =========================
   FIX RENDER MENU
========================= */

function renderMittagsMenu() {

    mittagsGrid.innerHTML = '';

    mittagsMenu.forEach(item => {

        const card =
            document.createElement('div');

        card.className =
            'mittags-card';

        /* =========================
           OPTIONS
        ========================= */

        let optionsHTML = '';

        if (Array.isArray(item.options) && item.options.length > 0) {

            optionsHTML = item.options.map(option => {

                const product = {
                    id: item.id,
                    name: `${item.name} - ${option.label}`,
                    price: option.price
                };

                return `
                    <div class="mittags-option">

                        <div class="mittags-option-left">

                            <span>${option.label}</span>

                            ${option.isVegetarian ? `
                                <span class="veg-badge">Vegetarisch</span>
                            ` : ''}

                        </div>

                        <div class="mittags-option-right">

                            <span class="mittags-option-price">
                                € ${option.price.toFixed(2)}
                            </span>

                            <button class="add-btn"
                                onclick='addToCart(${JSON.stringify(product)})'>
                                Hinzufügen
                            </button>

                        </div>

                    </div>
                `;
            }).join('');
        }

        /* =========================
           SINGLE PRICE (M5/M6 FIX)
        ========================= */

        let priceHTML = '';

        if (!item.options && item.price !== null && item.price !== undefined) {

            const product = {
                id: item.id,
                name: item.name,
                price: item.price
            };

            priceHTML = `
                <div class="mittags-single-price">

                    <span>Preis</span>

                    <strong>€ ${item.price.toFixed(2)}</strong>

                    <button class="add-btn"
                        onclick='addToCart(${JSON.stringify(product)})'>
                        Hinzufügen
                    </button>

                </div>
            `;
        }

        /* =========================
           BADGE
        ========================= */

        let badgeHTML = '';

        if (item.isSushi) {
            badgeHTML = `
                <div class="sushi-badge">
                    Sushi Menü
                </div>
            `;
        }

        /* =========================
           CARD
        ========================= */

        card.innerHTML = `
            <div class="mittags-image">

                <img src="${item.image}" alt="${item.name}">

                ${badgeHTML}

            </div>

            <div class="mittags-content">

                <div class="mittags-top">

                    <span class="mittags-id">
                        ${item.id}
                    </span>

                    <h3 class="mittags-name">
                        ${item.name}
                    </h3>

                </div>

                ${item.description ? `
                    <p class="mittags-description">
                        ${item.description}
                    </p>
                ` : ''}

                ${optionsHTML}
                ${priceHTML}

            </div>
        `;

        mittagsGrid.appendChild(card);
    });
}

/* =========================

========================= */

const mittagsGrid = document.getElementById('mittags-grid');

// Populate mittagsInfo
if (typeof mittagsInfo !== 'undefined') {

    const timeEl = document.getElementById('mittags-time');
    const noteEl = document.getElementById('mittags-note');
    const includedEl = document.getElementById('mittags-included');
    const footerEl = document.getElementById('mittags-footer');

    if (titleEl) titleEl.textContent = mittagsInfo.title;
    if (timeEl) timeEl.textContent = mittagsInfo.time;
    if (noteEl) noteEl.textContent = mittagsInfo.note;
    if (includedEl) includedEl.innerHTML = `<p>${mittagsInfo.included}</p>`;
    if (footerEl) footerEl.textContent = mittagsInfo.footer;
}

renderMittagsMenu();
updateCartCount();
updateHeaderCartCount();
      const headerPlaceholder = document.getElementById('header-placeholder');
      const footerPlaceholder = document.getElementById('footer-placeholder');

      const headerFallback = `
        <header class="header" id="mainHeader">

            <div class="header-container">

                <a href="../index.html" class="logo">
                    <img src="../assets/images/logo/mstile-310x310.png" alt="Aura Restaurant Logo">

      `;

      const footerFallback = `
        <footer class="footer">

            <div class="footer-container">
                <div class="footer-column">
                    <a href="../index.html" class="footer-logo">AURA</a>
                    <p class="footer-description">Authentische Asia Küche & Sushi Erlebnis.</p>

      function insertHeader(html) {
        if (headerPlaceholder) headerPlaceholder.innerHTML = html;
      }
      function insertFooter(html) {
        if (footerPlaceholder) footerPlaceholder.innerHTML = html;
      }

      function loadHeader() {
        if (window.location.protocol === 'file:') {
          insertHeader(headerFallback);
          const script = document.createElement('script');
          script.src = '../assets/js/header.js';
          document.body.appendChild(script);
        } else {
          fetch('../components/header.html')
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(data => {
              insertHeader(data);
              const script = document.createElement('script');
              script.src = '../assets/js/header.js';
              document.body.appendChild(script);
            })
            .catch(() => {
              insertHeader(headerFallback);
              const script = document.createElement('script');
              script.src = '../assets/js/header.js';
              document.body.appendChild(script);
            });
        }
      }

      function loadFooter() {
        if (window.location.protocol === 'file:') {
          insertFooter(footerFallback);
        } else {
          fetch('../components/footer.html')
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(data => insertFooter(data))
            .catch(() => insertFooter(footerFallback));
        }
      }

      loadHeader();
      loadFooter();

// Only initialize slider if elements exist
const tracks =
    document.querySelectorAll('.slider-track');

if (tracks.length > 0) {

    const tabs =
        document.querySelectorAll('.menu-tab');

    const prevButton =
        document.querySelector('.slider-arrow.prev');

    const nextButton =
        document.querySelector('.slider-arrow.next');

    const dotsContainer =
        document.querySelector('.slider-dots');

    const counter =
        document.querySelector('.slider-counter');

    let currentTrack =
        document.querySelector('.active-track');

    let slides =
        currentTrack.querySelectorAll('.slider-slide');

    let currentSlide = 0;

    /* =========================
       UPDATE
    ========================= */

    function updateSlider(){

        const slideWidth =
            slides[0].clientWidth;

        currentTrack.style.transform =
            `translateX(-${currentSlide * slideWidth}px)`;

        document
            .querySelectorAll('.slider-dot')
            .forEach((dot,index)=>{

                dot.classList.toggle(
                    'active',
                    index === currentSlide
                );

            });

        counter.textContent =
            `${currentSlide + 1} / ${slides.length}`;
    }

    /* =========================
       DOTS
    ========================= */

    function createDots(){

        dotsContainer.innerHTML = '';

        slides.forEach((_,index)=>{

            const dot =
                document.createElement('button');

            dot.className = 'slider-dot';

            dot.addEventListener('click',()=>{

                currentSlide = index;

                updateSlider();

            });

            dotsContainer.appendChild(dot);

        });

    }

    /* =========================
       LOOP SLIDER
    ========================= */

    function goNext(){

        currentSlide++;

        if(currentSlide >= slides.length){

            currentSlide = 0;
        }

        updateSlider();
    }

    function goPrev(){

        currentSlide--;

        if(currentSlide < 0){

            currentSlide = slides.length - 1;
        }

        updateSlider();
    }

    /* BUTTONS */

    nextButton.addEventListener(
        'click',
        goNext
    );

    prevButton.addEventListener(
        'click',
        goPrev
    );

    /* =========================
       TOUCH SWIPE
    ========================= */

    let startX = 0;
    let endX = 0;

    document
    .querySelector('.slider-track-wrapper')
    .addEventListener(
        'touchstart',
        (e)=>{

            startX =
                e.touches[0].clientX;

        },
        { passive:true }
    );

    document
    .querySelector('.slider-track-wrapper')
    .addEventListener(
        'touchend',
        (e)=>{

            endX =
                e.changedTouches[0].clientX;

            handleSwipe();

        },
        { passive:true }
    );

    /* DESKTOP */

    document
    .querySelector('.slider-track-wrapper')
    .addEventListener(
        'mousedown',
        (e)=>{

            startX = e.clientX;

        }
    );

    document
    .querySelector('.slider-track-wrapper')
    .addEventListener(
        'mouseup',
        (e)=>{

            endX = e.clientX;

            handleSwipe();

        }
    );

    /* SWIPE */

    function handleSwipe(){

        const diff = startX - endX;

        if(Math.abs(diff) < 50) return;

        if(diff > 0){

            goNext();

        }else{

            goPrev();
        }

    }

    /* =========================
       TAB SWITCH
    ========================= */

    tabs.forEach(tab=>{

        tab.addEventListener(
            'click',
            ()=>{

                tabs.forEach(t=>
                    t.classList.remove('active')
                );

                tracks.forEach(track=>
                    track.classList.remove('active-track')
                );

                tab.classList.add('active');

                const target =
                    tab.dataset.tab;

                currentTrack =
                    document.querySelector(
                        `.${target}-track`
                    );

                currentTrack.classList.add(
                    'active-track'
                );

                slides =
                    currentTrack.querySelectorAll(
                        '.slider-slide'
                    );

                currentSlide = 0;

                createDots();

                updateSlider();

            }
        );

    });

    /* INIT */

    createDots();

    updateSlider();

    window.addEventListener(
        'resize',
        updateSlider
    );

}

</script>
