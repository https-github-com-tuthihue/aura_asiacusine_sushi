      const headerPlaceholder = document.getElementById('header-placeholder');

    const headerFallback = `

                    <!-- MOBILE MENU -->

                        class="mobile-toggle"

        </header>


        <div class="mobile-sidebar" id="mobileSidebar">

                <a href="../contact.html">Kontakt</a>

        </div>
      `;

      const footerFallback = `
        <footer class="footer">

            <div class="footer-container">
                <div class="footer-column">
                    <a href="../index.html" class="footer-logo">AURA</a>
                    <p class="footer-description">Authentische Asia Küche & Sushi Erlebnis.</p>

                    </div>
                </div>
                <div class="footer-column">
                    <h3>Kontakt</h3>
                    <div class="footer-contact">
                        <p><strong>Feuchtwangen</strong></p>
                        <p>Dinkelsbühler Str 6, 91555 Feuchtwangen</p>
                        <p>09852-9080400</p>
                        <p style="margin-top: 16px;"><strong>Gunzenhausen</strong></p>
                        <p>Gerberstraße 6 - 91710 Gunzenhausen</p>
                        <p>09831-8822868</p>
                    </div>
                </div>
                <div class="footer-column">
                    <h3>Folge uns</h3>
                    <div class="footer-social-column">
                        <a href="https://www.instagram.com/aura_asiacusine_sushi/">Instagram</a>

  const mainHeader =
        document.getElementById('mainHeader');

        if(mainHeader){

            window.addEventListener('scroll', () => {

                if(window.scrollY > 50){

                    mainHeader.classList.add('scrolled');

                }else{

                    mainHeader.classList.remove('scrolled');

                }

            });

        }
        
      function insertHeader(html) {
        if (headerPlaceholder) headerPlaceholder.innerHTML = html;
      }
      function insertFooter(html) {
        if (footerPlaceholder) footerPlaceholder.innerHTML = html;
      }

      function loadHeader() {
        if (window.location.protocol === 'file:') {
          insertHeader(headerFallback);
          const script = document.createElement('script');
          script.src = '../assets/js/header.js';
          document.body.appendChild(script);
        } else {
          fetch('../components/header.html')
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(data => {
                insertHeader(data);

                /* =========================
                BRANCH TITLE
                ========================= */

                const branchTitle =
                    document.body.dataset.branch;

                const branchElement =
                    document.querySelector('.branch-title');

                if(branchElement && branchTitle){

                    branchElement.textContent =
                        branchTitle;

                }


                /* =========================
                HEADER JS
                ========================= */

                const script =
                    document.createElement('script');

                script.src =
                    '../assets/js/header.js';

                document.body.appendChild(script);

            })
            .catch(() => {
              insertHeader(headerFallback);
              const script = document.createElement('script');
              script.src = '../assets/js/header.js';
              document.body.appendChild(script);
            });
        }
      }

      function loadFooter() {
        if (window.location.protocol === 'file:') {
          insertFooter(footerFallback);
        } else {
          fetch('../components/footer.html')
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(data => insertFooter(data))
            .catch(() => insertFooter(footerFallback));
        }
      }

      loadHeader();
      loadFooter();

const tracks =
    document.querySelectorAll('.slider-track');

const tabs =
    document.querySelectorAll('.menu-tab');

const prevButton =
    document.querySelector('.slider-arrow.prev');

const nextButton =
    document.querySelector('.slider-arrow.next');

const dotsContainer =
    document.querySelector('.slider-dots');

const counter =
    document.querySelector('.slider-counter');

let currentTrack =
    document.querySelector('.active-track');

let slides =
    currentTrack.querySelectorAll('.slider-slide');

let currentSlide = 0;

/* =========================
   UPDATE
========================= */

function updateSlider(){

    const slideWidth =
        slides[0].clientWidth;

    currentTrack.style.transform =
        `translateX(-${currentSlide * slideWidth}px)`;

    document
        .querySelectorAll('.slider-dot')
        .forEach((dot,index)=>{

            dot.classList.toggle(
                'active',
                index === currentSlide
            );

        });

    counter.textContent =
        `${currentSlide + 1} / ${slides.length}`;
}

/* =========================
   DOTS
========================= */

function createDots(){

    dotsContainer.innerHTML = '';

    slides.forEach((_,index)=>{

        const dot =
            document.createElement('button');

        dot.className = 'slider-dot';

        dot.addEventListener('click',()=>{

            currentSlide = index;

            updateSlider();

        });

        dotsContainer.appendChild(dot);

    });

}

/* =========================
   LOOP SLIDER
========================= */

function goNext(){

    currentSlide++;

    if(currentSlide >= slides.length){

        currentSlide = 0;
    }

    updateSlider();
}

function goPrev(){

    currentSlide--;

    if(currentSlide < 0){

        currentSlide = slides.length - 1;
    }

    updateSlider();
}

/* BUTTONS */

nextButton.addEventListener(
    'click',
    goNext
);

prevButton.addEventListener(
    'click',
    goPrev
);

/* =========================
   TOUCH SWIPE
========================= */

let startX = 0;
let endX = 0;

document
.querySelector('.slider-track-wrapper')
.addEventListener(
    'touchstart',
    (e)=>{

        startX =
            e.touches[0].clientX;

    },
    { passive:true }
);

document
.querySelector('.slider-track-wrapper')
.addEventListener(
    'touchend',
    (e)=>{

        endX =
            e.changedTouches[0].clientX;

        handleSwipe();

    },
    { passive:true }
);

/* DESKTOP */

document
.querySelector('.slider-track-wrapper')
.addEventListener(
    'mousedown',
    (e)=>{

        startX = e.clientX;

    }
);

document
.querySelector('.slider-track-wrapper')
.addEventListener(
    'mouseup',
    (e)=>{

        endX = e.clientX;

        handleSwipe();

    }
);

/* SWIPE */

function handleSwipe(){

    const diff = startX - endX;

    if(Math.abs(diff) < 50) return;

    if(diff > 0){

        goNext();

    }else{

        goPrev();
    }

}

/* =========================
   TAB SWITCH
========================= */

tabs.forEach(tab=>{

    tab.addEventListener(
        'click',
        ()=>{

            tabs.forEach(t=>
                t.classList.remove('active')
            );

            tracks.forEach(track=>
                track.classList.remove('active-track')
            );

            tab.classList.add('active');

            const target =
                tab.dataset.tab;

            currentTrack =
                document.querySelector(
                    `.${target}-track`
                );

            currentTrack.classList.add(
                'active-track'
            );

            slides =
                currentTrack.querySelectorAll(
                    '.slider-slide'
                );

            currentSlide = 0;

            createDots();

            updateSlider();

        }
    );

});

/* INIT */

createDots();

updateSlider();

window.addEventListener(
    'resize',
    updateSlider
);

</script>
