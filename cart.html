            <div class="cart-summary">

                    Bestellübersicht

    <!-- FOOTER -->

    <div id="footer-placeholder"></div>

    <script>

        const cartItemsContainer =
            document.getElementById('cartItems');

        const cartTotal =
            document.getElementById('cartTotal');

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            if (window.refreshHeaderCartCount) window.refreshHeaderCartCount();
        }

        /* =========================
           RENDER CART
        ========================= */

        function renderCart(){

            const cart =
                JSON.parse(
                    localStorage.getItem('cart')
                ) || [];

            if(cart.length === 0){

                cartItemsContainer.innerHTML = `

                    <div class="empty-cart">

                        <h2>
                            Your cart is empty
                        </h2>

                        <a href="./pages/menu-feuchtwangen.html"
                           class="back-menu-btn">

                            Explore Menu

                        </a>

                    </div>

                `;

                cartTotal.innerText = '0€';

                return;
            }

            let total = 0;

            cartItemsContainer.innerHTML =
                cart.map(item=>{

                    total +=
                        item.price * item.quantity;

                    return `

                        <div class="cart-item">

                            <div class="cart-info">

                                <h3>

                                    ${item.id ? item.id + '. ' : ''}${item.name}

                                </h3>

                                <p>

                                    €${item.price.toFixed(1)}

                                </p>

                            </div>

                            <div class="cart-actions">

                                <button onclick="decreaseQuantity(${item.id}, '${item.name}')">

                                    -

                                </button>

                                <span>

                                    ${item.quantity}

                                </span>

                                <button onclick="increaseQuantity(${item.id}, '${item.name}')">

                                    +

                                </button>

                                <button class="delete-btn"
                                        onclick="removeItem(${item.id}, '${item.name}')">

                                    Entfernen

                                </button>

                            </div>

                        </div>

                    `;

                }).join('');

            cartTotal.innerText =
                `€${total.toFixed(1)}`;

        }

        /* =========================
           UPDATE QUANTITY
        ========================= */

        function increaseQuantity(id,name){

            let cart =
                JSON.parse(
                    localStorage.getItem('cart')
                ) || [];

            const item =
                cart.find(item=>
                    item.id === id &&
                    item.name === name
                );

            if(item){

                item.quantity += 1;
            }

            saveCart(cart);

            renderCart();
        }

        function decreaseQuantity(id,name){

            let cart =
                JSON.parse(
                    localStorage.getItem('cart')
                ) || [];

            const item =
                cart.find(item=>
                    item.id === id &&
                    item.name === name
                );

            if(item){

                item.quantity -= 1;

                if(item.quantity <= 0){

                    cart =
                        cart.filter(cartItem=>
                            !(
                                cartItem.id === id &&
                                cartItem.name === name
                            )
                        );

                }

            }

            saveCart(cart);

            renderCart();
        }

        /* =========================
           REMOVE
        ========================= */

        function removeItem(id,name){

            let cart =
                JSON.parse(
                    localStorage.getItem('cart')
                ) || [];

            cart =
                cart.filter(item=>
                    !(
                        item.id === id &&
                        item.name === name
                    )
                );

            saveCart(cart);

            renderCart();

        }

        function insertHeader(html) {

                    </a>
                    <nav class="desktop-nav">
                        <a href="./index.html">Home</a>

                        <a href="./pages/menu-gunzenhausen.html">Gunzenhausen</a>

                    </nav>

        function insertFooter(html) {
            const footerPlaceholder = document.getElementById('footer-placeholder');
            if (footerPlaceholder) footerPlaceholder.innerHTML = html;
        }

        function loadHeader() {
            fetch('components/header.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => {
                    insertHeader(data);
                    const script = document.createElement('script');
                    script.src = './assets/js/header.js';
                    document.body.appendChild(script);
                })
                .catch(() => {
                    insertHeader(headerFallback);
                    const script = document.createElement('script');
                    script.src = './assets/js/header.js';
                    document.body.appendChild(script);
                });
        }

        function loadFooter() {
            fetch('components/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(data => insertFooter(data))
                .catch(() => insertFooter(footerFallback));
        }

        loadHeader();
        loadFooter();

        renderCart();

    </script>
